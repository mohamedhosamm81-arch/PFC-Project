[project]
name = "pfc-backend"
version = "1.0.0"
description = "Patient Flow Controller backend — queue, routing, attendance and realtime API"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: requires an async database driver (greenlet + aiosqlite)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
    "B008",  # FastAPI uses Depends()/Query() in argument defaults by design.
    "E501",  # Formatter owns wrapping; long URLs/SQL fragments are intentional.
    "UP017", # timezone.utc is intentionally explicit for readability.
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["E402", "I001"] # importorskip must run before app imports
